<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Airbus A320 map marker</title>
  <desc id="desc">Top-down yellow Airbus A320 aircraft icon, facing upward.</desc>
  <defs>
    <linearGradient id="airframe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE766"/>
      <stop offset="0.5" stop-color="#FFD21F"/>
      <stop offset="1" stop-color="#EAAA00"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEB75"/>
      <stop offset="1" stop-color="#F3B800"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.75" flood-color="#604000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- The aircraft is designed at a 128px viewBox so it remains sharp at map-marker sizes. -->
  <g filter="url(#shadow)" stroke="#825800" stroke-linejoin="round" stroke-linecap="round">
    <!-- swept main wings -->
    <path d="M55.2 52.1 12.5 76.8c-2.7 1.6-1.5 5.7 1.6 5.5l40.8-3.1 3-13.6Z" fill="url(#wing)" stroke-width="2.25"/>
    <path d="m72.8 52.1 42.7 24.7c2.7 1.6 1.5 5.7-1.6 5.5l-40.8-3.1-3-13.6Z" fill="url(#wing)" stroke-width="2.25"/>

    <!-- engine nacelles -->
    <path d="m34.9 70.9-8.4 1.3c-3 .5-4.2 3.3-2.6 5.9l5.3 8.5c1.1 1.8 3 2.6 5 2.2l7.8-1.6Z" fill="#F6B900" stroke-width="2"/>
    <path d="m93.1 70.9 8.4 1.3c3 .5 4.2 3.3 2.6 5.9l-5.3 8.5c-1.1 1.8-3 2.6-5 2.2L86 87.2Z" fill="#F6B900" stroke-width="2"/>
    <path d="m28.1 75.4 7.8-1.2 3.2 10.7-6.3 1.3Z" fill="#704C00" stroke="none"/>
    <path d="m99.9 75.4-7.8-1.2-3.2 10.7 6.3 1.3Z" fill="#704C00" stroke="none"/>

    <!-- fuselage -->
    <path d="M64 5.5c-5.6 0-10.1 7.1-11.7 16.7l-4.3 27.4-3.9 29.3c-.8 6.6 1.4 13.4 6.1 18.1l8.1 8.1V117c0 3.1 2.5 5.5 5.6 5.5h.2c3.1 0 5.6-2.4 5.6-5.5v-11.9l8.1-8.1c4.7-4.7 6.9-11.5 6.1-18.1L80 49.6l-4.3-27.4C74.1 12.6 69.6 5.5 64 5.5Z" fill="url(#airframe)" stroke-width="2.5"/>

    <!-- A320 tailplane -->
    <path d="m51.8 91.2-15.7 9.5c-2.6 1.5-1.5 5.5 1.5 5.5h21.2l1.2-8.9Z" fill="#FFD21F" stroke-width="2.25"/>
    <path d="m76.2 91.2 15.7 9.5c2.6 1.5 1.5 5.5-1.5 5.5H69.2L68 97.3Z" fill="#FFD21F" stroke-width="2.25"/>
    <path d="M58.9 106.2h10.2V117c0 2.8-2.3 5-5.1 5s-5.1-2.2-5.1-5Z" fill="#EAAF00" stroke-width="2"/>

    <!-- cockpit glazing and centerline detailing -->
    <path d="M58.6 17.4c1.3-3.5 3.3-5.8 5.4-5.8s4.1 2.3 5.4 5.8c-1.8.8-3.5 1.2-5.4 1.2s-3.6-.4-5.4-1.2Z" fill="#594000" stroke-width="1.25"/>
    <path d="M64 11.8v6.7M55.9 24.2c5.3 2.2 11 2.2 16.3 0M54.8 35.8c6 2 12.4 2 18.4 0M52.1 53.2c7.8 2.2 16 2.2 23.8 0" fill="none" stroke="#B77A00" stroke-width="1.15" opacity=".85"/>
    <path d="M64 21v77" fill="none" stroke="#FFF1A2" stroke-width="1.25" opacity=".65"/>
    <path d="M64 25.5v4.4M64 39.8v4.4M64 58.1v4.4M64 67v4.4M64 76v4.4" fill="none" stroke="#9B6900" stroke-width="1.25" opacity=".65"/>

    <!-- wing control-surface lines -->
    <path d="m18.2 78 29.4-3.1M109.8 78 80.4 74.9M39.5 101.2l12.5-3.9M88.5 101.2 76 97.3" fill="none" stroke="#B77900" stroke-width="1.25" opacity=".85"/>
  </g>
</svg>
