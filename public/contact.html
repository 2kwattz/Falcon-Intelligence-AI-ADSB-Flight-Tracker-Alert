<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Falcon Intelligence.">
  <title>Contact Us | Falcon Intelligence</title>
  <style>
    :root {
      --page:#07111d;
      --line:#294258;
      --ink:#e7f1fa;
      --muted:#91a6b9;
      --teal:#58dfbc;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--page);
    }
    * { box-sizing:border-box; }
    body { min-width:320px; margin:0; background:linear-gradient(90deg,rgba(7,17,29,.96) 0%,rgba(7,17,29,.86) 48%,rgba(7,17,29,.7) 100%),radial-gradient(circle at 85% -10%,rgba(24,57,78,.72) 0,transparent 32rem),url("/assets/rafale-contact-background.png") 62% center / cover fixed,var(--page); }
    a { color:inherit; text-decoration:none; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    .shell { max-width:1240px; margin:auto; padding:0 28px; }
    .contact-shell { max-width:1016px; }
    .skip-link { position:absolute; left:-999px; top:0; z-index:20; padding:.6rem 1rem; color:#000; background:#fff; }
    .skip-link:focus { left:1rem; top:1rem; }

    .site-header { position:sticky; top:0; z-index:10; border-bottom:1px solid rgba(41,66,88,.82); background:rgba(7,17,29,.82); backdrop-filter:blur(16px); }
    .nav { position:relative; display:flex; align-items:center; gap:28px; min-height:82px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:.82rem; letter-spacing:.1em; white-space:nowrap; }
    .brand-mark { position:relative; display:grid; width:53px; height:53px; flex:0 0 53px; place-items:center; isolation:isolate; }
    .brand-mark img { position:relative; z-index:1; display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 3px 7px rgba(0,0,0,.38)); }
    .brand small { display:block; margin-top:2px; color:var(--muted); font-size:.55rem; letter-spacing:.2em; }
    .laser-eye { position:absolute; z-index:0; top:21px; width:76px; height:3px; opacity:0; pointer-events:none; filter:blur(.15px) drop-shadow(0 0 5px #ff2525); animation:laser-burst 6s infinite; }
    .laser-eye.left { right:32px; transform-origin:right center; background:linear-gradient(90deg,transparent 0%,rgba(255,34,34,.28) 40%,#ffb0a8 100%); }
    .laser-eye.right { left:32px; transform-origin:left center; background:linear-gradient(90deg,#ffb0a8 0%,rgba(255,34,34,.28) 60%,transparent 100%); }
    @keyframes laser-burst { 0%,84%,100% { opacity:0; transform:scaleX(.06); } 87% { opacity:.95; transform:scaleX(1); } 91% { opacity:.48; transform:scaleX(.78); } 94% { opacity:.9; transform:scaleX(1); } 97% { opacity:0; transform:scaleX(.2); } }
    .nav-links { display:flex; align-items:center; gap:22px; margin-left:auto; }
    .nav-links a { position:relative; color:var(--muted); font-size:.76rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap; }
    .nav-links a:hover,.nav-links a.active { color:var(--ink); }
    .nav-links a.active::after { position:absolute; right:0; bottom:-12px; left:0; height:2px; content:""; background:var(--teal); }
    .nav-cta,.button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 19px; border:1px solid rgba(150,255,235,.58); border-radius:8px; color:#031b19; background:linear-gradient(135deg,#8af4d4 0%,#55debc 48%,#37b9c5 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.48),0 9px 20px rgba(38,184,170,.18); font-size:.72rem; font-weight:850; line-height:1; letter-spacing:.1em; text-align:center; text-transform:uppercase; transition:transform .2s,box-shadow .2s,filter .2s; }
    .nav-cta:hover,.button:hover { transform:translateY(-2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.58),0 14px 30px rgba(50,206,189,.3); filter:saturate(1.12) brightness(1.05); }
    .menu-button { display:none; width:42px; height:40px; margin-left:auto; border:1px solid var(--line); border-radius:7px; color:var(--ink); background:transparent; font-size:1.2rem; }

    main { display:grid; min-height:calc(100vh - 82px); place-items:center; padding:42px 28px 74px; }
    .contact-card { display:grid; grid-template-columns:.8fr 1.2fr; width:100%; overflow:hidden; border:1px solid rgba(86,223,188,.3); border-radius:14px; background:linear-gradient(120deg,rgba(17,38,56,.94),rgba(11,23,37,.9)); box-shadow:0 28px 70px rgba(0,0,0,.4); backdrop-filter:blur(5px); }
    .intro { padding:48px; border-right:1px solid #294258; }
    .eyebrow { margin:0 0 14px; color:var(--teal); font-size:.68rem; font-weight:800; letter-spacing:.19em; text-transform:uppercase; }
    h1 { margin:0 0 14px; font-size:clamp(2.2rem,5vw,3.5rem); letter-spacing:-.06em; line-height:.98; }
    .intro p:last-child { margin:0; color:var(--muted); line-height:1.7; }
    form { display:grid; gap:15px; padding:48px; }
    label { display:grid; gap:7px; color:var(--muted); font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    input,textarea { width:100%; min-height:45px; padding:11px; border:1px solid #345168; border-radius:7px; outline:none; color:var(--ink); background:#081522; letter-spacing:normal; text-transform:none; }
    textarea { min-height:160px; resize:vertical; }
    input:focus,textarea:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(86,223,188,.09); }
    form .button { justify-self:start; }
    button:disabled { cursor:wait; opacity:.7; }
    .status { min-height:20px; margin:0; color:var(--teal); font-size:.82rem; line-height:1.4; }
    .site-footer { padding-top:28px; padding-bottom:36px; color:#71879a; font-size:.7rem; letter-spacing:.06em; text-align:center; }
    @media (max-width:980px) { .nav-links { gap:14px; } .nav-links a { font-size:.68rem; } .nav-cta { display:none; } }
    @media (max-width:710px) { .shell { padding:0 17px; } .nav { min-height:70px; } .brand-mark { width:46px; height:46px; flex-basis:46px; } .menu-button { display:block; } .nav-links { position:absolute; top:66px; right:17px; left:17px; z-index:2; display:none; padding:16px; border:1px solid var(--line); border-radius:10px; background:#0b1825; flex-direction:column; align-items:stretch; gap:17px; } .nav-links.open { display:flex; } .nav-links a.active::after { display:none; } main { min-height:calc(100vh - 70px); padding:34px 17px 64px; } }
    @media (max-width:700px) { .contact-card { grid-template-columns:1fr; } .intro { padding:34px 25px; border-right:0; border-bottom:1px solid #294258; } form { padding:30px 25px; } form .button { width:100%; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#contact-title">Skip to contact form</a>
  <header class="site-header">
    <nav class="nav shell" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="Falcon Intelligence home"><span class="brand-mark"><i class="laser-eye left" aria-hidden="true"></i><i class="laser-eye right" aria-hidden="true"></i><img src="/assets/falcon-laser-logo.png" alt=""></span><span><strong>FALCON</strong><small>INTELLIGENCE</small></span></a>
      <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/tracked-aircrafts">Intelligence Archive</a>
        <a href="/live-map">Live Map</a>
        <a href="/explore">Explore</a>
        <a href="/about">About</a>
        <a class="active" href="/contact">Contact</a>
      </div>
      <a class="nav-cta" href="/login">Login</a>
    </nav>
  </header>
  <main class="shell contact-shell">
    <section class="contact-card" aria-labelledby="contact-title">
      <div class="intro"><p class="eyebrow">Contact</p><h1 id="contact-title">Contact Us</h1><p>Have a question, idea, or feedback? Send a message and I will get back to you.</p></div>
      <form id="contact-message-form">
        <label>Name<input required name="name" autocomplete="name" placeholder="Your name"></label>
        <label>Email<input required type="email" name="email" autocomplete="email" placeholder="you@example.com"></label>
        <label>Message<textarea required name="message" maxlength="3000" placeholder="Write your message..."></textarea></label>
        <button class="button" type="submit">Send message</button>
        <p class="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer shell">&copy; Falcon Intelligence by @2kwattz | Roshan Bhatia</footer>
  <script>
    (() => {
      const menu = document.querySelector(".menu-button");
      const links = document.querySelector(".nav-links");
      menu.addEventListener("click", () => {
        const open = links.classList.toggle("open");
        menu.setAttribute("aria-expanded", String(open));
        menu.textContent = open ? "\u00d7" : "\u2630";
      });
      links.querySelectorAll("a").forEach((link) => link.addEventListener("click", () => {
        links.classList.remove("open");
        menu.setAttribute("aria-expanded", "false");
        menu.textContent = "\u2630";
      }));

      document.querySelector("#contact-message-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const status = form.querySelector(".status");
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        status.textContent = "Sending your message...";
        try {
          const response = await fetch("/contact-message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const result = await response.json();
          if (!response.ok || !result.status) throw new Error(result.message || "Unable to send your message.");
          status.textContent = "Thanks - your message has been sent.";
          form.reset();
        } catch (error) {
          status.textContent = error.message || "Unable to send your message. Please try again.";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
